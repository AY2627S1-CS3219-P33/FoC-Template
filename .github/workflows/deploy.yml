# AI Assistance Disclosure:
# Tool: ChatGPT (model: GPT-6 Luna), date: 2026-11-11
# Scope: Configuration of the GitHub Actions deployment workflow.
# Author review: I validated correctness, edited for style, and added boundary checks.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: Auto selects changes since each component's last deployment
        type: choice
        options: [auto, all, user-service, supplier-service, credit-service, order-service, admin-service, chat-service, notification-service, frontend]
        default: auto
      operation:
        description: Deploy this main commit, or roll back one selected component
        type: choice
        options: [deploy, rollback]
        default: deploy
      migrations_applied:
        description: Required migrations are applied; for rollback, the database is compatible
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  checks:
    if: >-
      github.repository == 'AY2627S1-CS3219-P33/FoC-Template' &&
      github.ref == 'refs/heads/main' && inputs.operation == 'deploy'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: >-
      !cancelled() &&
      github.repository == 'AY2627S1-CS3219-P33/FoC-Template' &&
      github.ref == 'refs/heads/main' &&
      (needs.checks.result == 'success' || inputs.operation == 'rollback')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_PAGER: ''
      AWS_CLI_AUTO_PROMPT: 'off'
      DEPLOY_COMPONENT: ${{ inputs.component }}
      DEPLOY_OPERATION: ${{ inputs.operation }}
      MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require AWS configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$ROLE_ARN"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '842761392141'
          role-session-name: github-deploy-${{ github.run_id }}
      - name: Deploy selected components
        run: python3 .github/scripts/deploy.py
