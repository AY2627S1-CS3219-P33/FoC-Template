# chat-service's containers. The root compose.yaml includes this file, so run
# `docker compose up` from the repository root; RabbitMQ (queue-service) is
# defined there.
#
# Values are interpolated from chat-service/.env (copy .env.example), with
# local-development defaults, so the stack starts without that file. Secrets
# reach the container only at run time and are never built into the image.
services:
  chat-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_service
      POSTGRES_USER: chat_service
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat-local-dev}
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_service -d chat_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chat-internal

  # One-shot job: applies new migrations, then exits. The service never runs
  # DDL itself, and /readyz stays 503 until the schema is current.
  chat-migrate:
    # Its own tag: building the shared foc-goose-migrator tag from an
    # included file races the root file's identical build.
    image: foc-chat-migrator:local
    build:
      context: ../supplier-service
      dockerfile: migrate.Dockerfile
    command: ["-dir", "/migrations", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgresql://chat_service:${CHAT_DB_PASSWORD:-chat-local-dev}@chat-db:5432/chat_service?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - chat-internal
    restart: "no"

  chat-service:
    build: .
    image: foc-chat-service:local
    env_file:
      - path: .env
        required: false
    # These override .env, whose values are for running on the host.
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "3006"
      DATABASE_URL: postgresql://chat_service:${CHAT_DB_PASSWORD:-chat-local-dev}@chat-db:5432/chat_service?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-foc}:${RABBITMQ_DEFAULT_PASS:-foc-local-dev}@queue-service:5672/
      # Placeholder so the service starts without .env; set the real tenant
      # in chat-service/.env before using authenticated routes.
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://your-tenant.auth0.com/}
      # nginx (user-frontend, :8081) and the Vite dev server (:5173).
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-localhost:8081,localhost:5173}
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      chat-db:
        condition: service_healthy
      chat-migrate:
        condition: service_completed_successfully
      # RabbitMQ, defined in the root compose.yaml. chat-service would also
      # start without it (the consumer reconnects, /readyz says "degraded"),
      # but waiting lets it subscribe at once.
      queue-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3006/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # WebSocket clients get time to close cleanly on `docker compose down`.
    stop_grace_period: 30s
    networks:
      # default is the root project's network, shared with queue-service.
      - default
      - chat-internal

networks:
  # Only chat-service reaches its database.
  chat-internal:
    internal: true

volumes:
  chat-db-data:
