# chat-service's containers. The root compose.yaml includes this file, so run
# `docker compose up` from the repository root; RabbitMQ (queue-service) is
# defined there.
#
# Values are interpolated from chat-service/.env (copy .env.example), with
# local-development defaults, so the stack starts without that file. Secrets
# reach the container only at run time and are never built into the image.
#
# chat-migrate (goose, like order-migrate) is added together with the first
# migration: goose fails on an empty migrations folder.
services:
  chat-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_service
      POSTGRES_USER: chat_service
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat-local-dev}
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_service -d chat_service"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chat-internal

  chat-service:
    build: .
    image: foc-chat-service:local
    env_file:
      - path: .env
        required: false
    # These override .env, whose values are for running on the host.
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "3005"
      DATABASE_URL: postgresql://chat_service:${CHAT_DB_PASSWORD:-chat-local-dev}@chat-db:5432/chat_service?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-foc}:${RABBITMQ_DEFAULT_PASS:-foc-local-dev}@queue-service:5672/
      # Placeholder so the service starts without .env; set the real tenant
      # in chat-service/.env before using authenticated routes.
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://your-tenant.auth0.com/}
      # nginx (user-frontend, :8081) and the Vite dev server (:5173).
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-localhost:8081,localhost:5173}
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      chat-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3005/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # WebSocket clients get time to close cleanly on `docker compose down`.
    stop_grace_period: 30s
    networks:
      # default is the root project's network, shared with queue-service.
      - default
      - chat-internal

networks:
  # Only chat-service reaches its database.
  chat-internal:
    internal: true

volumes:
  chat-db-data:
