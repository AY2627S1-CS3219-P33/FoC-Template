openapi: 3.1.0

info:
  title: Friend on Campus Credit Service API
  version: 0.1.0-draft
  description: >-
    PROPOSED, NOT FROZEN. credit-service currently has no implementation and
    no agreed HTTP contract; it appears in the repository only as the
    RabbitMQ command/result contract in order-service/docs/contracts.md
    ("Credit message contract (proposed, gate C1)"), and as the unimplemented
    service.CreditBalanceReader interface in user-service.

    This file is the read-only HTTP surface the frontend needs so the credit
    screens can be built before the service exists, derived from that message
    contract. It is deliberately read-only: the closed credit economy moves
    credits only through credit.reserve / credit.adjust / credit.release /
    credit.transfer commands published by order-service, never through a
    client-facing HTTP write, and credits cannot be bought, withdrawn or
    exchanged for money. The owner of credit-service should amend or replace
    this file; user-frontend/src/api/credit.ts is the only client of it.

    Open question for the owner: user-service's CreditBalanceReader returns an
    "exact decimal balance" as a string, while order-service's Reward is
    integer int32. This draft uses integers to match the frozen order
    contract. If credits are decimal, change amount and balance to strings
    here and in the client.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /credit-service
    description: API gateway route

tags:
  - name: Balances
    description: The caller's own balance and ledger.
  - name: Administration
    description: Administrator reads of another account's credit position.
  - name: Operations
    description: Service health.

paths:
  /credits/me:
    get:
      operationId: getMyBalance
      tags: [Balances]
      summary: Read the caller's credit position
      description: >-
        available is what the caller can still commit to a new errand;
        reserved is held by errands awaiting an outcome; total is their sum.
        A reservation leaves total unchanged and moves credits from available
        to reserved.
      x-required-permissions: [credits:read]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's credit position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /credits/me/transactions:
    get:
      operationId: listMyTransactions
      tags: [Balances]
      summary: List the caller's credit movements
      description: >-
        The caller's ledger, newest first. One entry per applied credit
        command, so an errand that was reserved then completed has a RESERVE
        and a TRANSFER_OUT entry. Entries are immutable.
      x-required-permissions: [credits:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of ledger entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /credits/me/reservations:
    get:
      operationId: listMyReservations
      tags: [Balances]
      summary: List the caller's active holds
      description: >-
        Reservations still held, newest first, each naming the errand that
        holds it. Their amounts sum to reserved in /credits/me.
      x-required-permissions: [credits:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of active reservations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationPage"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /admin/credits/{userId}:
    get:
      operationId: getAccountBalance
      tags: [Administration]
      summary: Read another account's credit position
      description: >-
        For resolving disputes (F6.1). Read-only: an administrator cannot
        move credits here, because every movement belongs to an errand
        outcome.
      x-required-permissions: [credits:review]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: That account's credit position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AccountNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"

  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Check whether credit operations can run
      security: []
      responses:
        "200":
          description: Dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A required dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Auth0 RS256 user access token for
        https://api.foc.local/credit-service. Balance routes require
        credits:read; administration routes require credits:review.

  parameters:
    UserID:
      name: userId
      in: path
      required: true
      description: Auth0 subject of the user.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      description: Maximum page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as nextCursor by the preceding page.
      schema:
        type: string
        maxLength: 512

  schemas:
    Balance:
      type: object
      description: >-
        total is available + reserved. Credits only circulate within the
        platform, so total changes only when an errand transfers credits
        between two accounts.
      required: [userId, available, reserved, total, updatedAt]
      properties:
        userId:
          type: string
        available:
          type: integer
          minimum: 0
          description: Committable to a new errand.
        reserved:
          type: integer
          minimum: 0
          description: Held by errands awaiting an outcome.
        total:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    TransactionKind:
      type: string
      description: >-
        One applied credit command. RESERVE holds a reward when an errand is
        requested; RELEASE returns a hold on cancel, expiry, refund or a
        failed reservation; ADJUST changes a held amount after a reward edit;
        TRANSFER_OUT settles a completed errand from the requester and
        TRANSFER_IN credits its courier.
      enum: [RESERVE, RELEASE, ADJUST, TRANSFER_OUT, TRANSFER_IN]

    Transaction:
      type: object
      required: [id, kind, amount, balanceAfter, createdAt]
      properties:
        id:
          type: string
          description: Opaque, stable ledger entry identifier.
        kind:
          $ref: "#/components/schemas/TransactionKind"
        amount:
          type: integer
          description: >-
            Signed effect on available: negative for RESERVE and positive for
            RELEASE and TRANSFER_IN. ADJUST is signed either way.
        balanceAfter:
          type: integer
          minimum: 0
          description: available immediately after this entry was applied.
        errandId:
          type: string
          format: uuid
          description: The errand this movement belongs to. Every movement has one.
        description:
          type: string
          maxLength: 200
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: string
          description: Omitted when there is no next page.
      additionalProperties: false

    Reservation:
      type: object
      required: [errandId, amount, createdAt]
      properties:
        errandId:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      additionalProperties: false

    ReservationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Reservation"
        nextCursor:
          type: string
          description: Omitted when there is no next page.
      additionalProperties: false

    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
      additionalProperties: false

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - FORBIDDEN
            - ACCOUNT_NOT_FOUND
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL
        message:
          type: string
      additionalProperties: false

  responses:
    InvalidArgument:
      description: The path or a query parameter is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: A valid access token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountNotFound:
      description: No credit account exists for this user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
