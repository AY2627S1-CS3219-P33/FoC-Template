  schemas:
    UserId:
      type: string
      minLength: 1
      description: Auth0 subject, for example auth0|req1. Not a UUID.
    ErrandStatus:
      type: string
      enum:
        - PENDING_RESERVATION
        - OPEN
        - ASSIGNED
        - PICKED_UP
        - DELIVERED
        - REVIEW_REQUIRED
        - REJECTED
        - CANCELLED
        - EXPIRED
        - COMPLETED
        - REFUNDED
      description: WITHDRAWN is an event; withdrawal leads to OPEN or EXPIRED.
    Envelope:
      type: object
      required:
        - messageId
        - type
        - occurredAt
        - errandId
        - errandVersion
        - data
      properties:
        messageId:
          type: string
          minLength: 1
          description: Stable deduplication key, not a UUID. Commands use
            <errandId>:reserve/release/transfer, <errandId>:adjust:<version> or
            <errandId>:adjust-revert:<newVersion>. Transition events use
            <errandId>:<event suffix>:<version>; rejections add the HTTP request
            ID; reminders use verify-reminder or pickup-reminder and version.
        correlationId:
          type: string
          minLength: 1
          description: "Credit results only: messageId of the command answered. Omitted
            otherwise."
        type:
          type: string
          minLength: 1
          description: Must equal the AMQP routing key and type property.
        occurredAt:
          type: string
          format: date-time
          description: Transition/result time, not publish/retry time.
        errandId:
          &a1
          type: string
          format: uuid
        errandVersion:
          &a2
          type: integer
          minimum: 1
        data:
          type: object
    ReserveCreditData:
      type: object
      required:
        - errandId
        - errandVersion
        - requesterId
        - amount
      properties:
        errandId: *a1
        errandVersion: *a2
        requesterId:
          &a3
          $ref: "#/components/schemas/UserId"
        amount: *a2
    AdjustCreditData:
      type: object
      required:
        - errandId
        - errandVersion
        - requesterId
        - newAmount
        - seq
      properties:
        errandId: *a1
        errandVersion: *a2
        requesterId: *a3
        newAmount:
          type: integer
          minimum: 1
          description: Absolute target reservation, not a delta.
        seq: *a2
    ReleaseCreditData:
      type: object
      description: Release the entire reservation; no amount is sent.
      required:
        - errandId
        - errandVersion
        - requesterId
      properties:
        errandId: *a1
        errandVersion: *a2
        requesterId: *a3
    TransferCreditData:
      type: object
      required:
        - errandId
        - errandVersion
        - requesterId
        - courierId
        - amount
      properties:
        errandId: *a1
        errandVersion: *a2
        requesterId: *a3
        courierId:
          $ref: "#/components/schemas/UserId"
        amount: *a2
    ReservedCreditData:
      type: object
      required:
        - amount
      properties:
        amount: *a2
    AdjustedCreditData:
      type: object
      required:
        - amount
        - seq
      properties:
        amount: *a2
        seq: *a2
    ReservationRefusedData:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - INSUFFICIENT_CREDITS
            - ACCOUNT_NOT_FOUND
            - RESERVATION_RELEASED
    AdjustRefusedData:
      type: object
      required:
        - code
        - seq
      properties:
        code:
          type: string
          enum:
            - INSUFFICIENT_CREDITS
            - RESERVATION_NOT_ACTIVE
        seq: *a2
    OperationFailedData:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - INSUFFICIENT_CREDITS
            - ACCOUNT_NOT_FOUND
            - RESERVATION_RELEASED
            - RESERVATION_NOT_ACTIVE
            - RESERVATION_ALREADY_TRANSFERRED
            - RESERVATION_ALREADY_RELEASED
            - RESERVATION_NOT_FOUND
          description: Stable credit failure code; no credentials or internal error details.
    EmptyResultData:
      type: object
      properties: {}
      additionalProperties: false
      description: Released/transferred results have empty data; amount and seq are
        omitted by CreditResult.
    PendingEditDetails:
      type: object
      description: Requested details with contactName and contactMobile removed,
        matching Details.WithoutContact().
      required:
        - supplierId
        - supplierVersionId
        - deliveryBuildingId
        - deliveryBuildingSnapshot
        - deliveryDetail
        - items
        - notes
        - reward
        - acceptanceDeadline
      properties:
        supplierId: *a1
        supplierVersionId: *a1
        deliveryBuildingId: *a1
        deliveryBuildingSnapshot:
          type: object
        deliveryDetail:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
        notes:
          type: string
        reward: *a2
        acceptanceDeadline:
          &a4
          type: string
          format: date-time
      additionalProperties: false
    ErrandEventData:
      type: object
      required:
        - errandId
        - errandVersion
        - event
        - to
        - actorType
        - requesterId
        - reward
        - at
      properties:
        errandId: *a1
        errandVersion: *a2
        event:
          type: string
          enum:
            - submit
            - reservation_confirmed
            - reservation_refused
            - reservation_failed
            - edit
            - cancel
            - confirm
            - dispute
            - edit_confirmed
            - edit_refused
            - accept
            - withdraw
            - pick_up
            - deliver
            - report_issue
            - acceptance_deadline_passed
            - pickup_deadline_passed
            - delivery_deadline_passed
            - verification_lapsed
            - admin_complete
            - admin_refund
        from:
          $ref: "#/components/schemas/ErrandStatus"
        to:
          $ref: "#/components/schemas/ErrandStatus"
        actorType:
          type: string
          enum:
            - REQUESTER
            - COURIER
            - ADMIN
            - SYSTEM
        actorId:
          $ref: "#/components/schemas/UserId"
          description: Omitted for SYSTEM actors.
        reason:
          type: string
          description: Free text for disputes/issues/admin resolutions, or a stable reason
            code for credit failures.
        reviewReason:
          type: string
          enum:
            - COURIER_ISSUE
            - DELIVERY_OVERDUE
            - REQUESTER_DISPUTE
        requesterId:
          $ref: "#/components/schemas/UserId"
        courierId:
          $ref: "#/components/schemas/UserId"
          description: Courier involved, including a courier just removed by withdrawal.
        reward: *a2
        at: *a4
        pendingEdit:
          $ref: "#/components/schemas/PendingEditDetails"
        editDropped:
          type: boolean
          description: True on acceptance that discarded a pending edit.
    RejectionData:
      type: object
      required:
        - errandId
        - errandVersion
        - status
        - action
        - code
        - actorType
        - actorId
        - at
      properties:
        errandId: *a1
        errandVersion: *a2
        status:
          $ref: "#/components/schemas/ErrandStatus"
        action:
          type: string
          enum:
            - accept
            - cancel
            - pickup
        code:
          type: string
          enum:
            - ERRAND_CHANGED
            - ERRAND_UNAVAILABLE
            - INVALID_TRANSITION
        actorType:
          type: string
          enum:
            - REQUESTER
            - COURIER
        actorId:
          $ref: "#/components/schemas/UserId"
        at: *a4
    ReminderData:
      type: object
      required:
        - errandId
        - errandVersion
        - status
        - requesterId
        - courierId
        - deadline
        - at
      properties:
        errandId: *a1
        errandVersion: *a2
        status:
          $ref: "#/components/schemas/ErrandStatus"
        requesterId:
          $ref: "#/components/schemas/UserId"
        courierId:
          $ref: "#/components/schemas/UserId"
        deadline: *a4
        at: *a4
