asyncapi: 3.0.0
info:
  title: Friend on Campus service messaging
  version: 0.2.0
  description: |-
    Shared application-level messaging contract over RabbitMQ / AMQP 0-9-1.
    The baseline is order-service/docs/contracts.md and internal/errand/{ports,outbox,state}.go.
    CS3219.drawio.xml supplies the business workflows; the order-service proposal
    supplies the more detailed expiry, pending-edit and settlement behavior.
    Credit-service implements the credit commands and results (credit-service/docs/contracts.md);
    notification-service still needs to implement this contract.

    Topology and ownership:
    - foc.commands: durable direct exchange for credit commands.
    - foc.events: durable topic exchange for errand events and credit results.
    - Publishers declare their exchanges idempotently; consumers own their queues.
    - credit-service.commands binds to the four credit command routing keys;
      credit-service owns its dead-letter queue.
    - order-service.credit-results binds to credit.# on foc.events. It is a quorum
      queue with x-delivery-limit 5 and dead-letters to order-service.credit-results.dlq.
    - Notification-service owns its queues, bound to errand.# or a subset. It chooses
      user recipients from requesterId, courierId, actorId and reviewReason, stores
      user-specific notifications and delivers them through its frontend interface.
      There is no notification.requested command or requirement for a queue per user.
    - Optional order-events.tap binds to errand.# only when AMQP_DECLARE_TAP is set.

    Delivery and recovery:
    - The transactional outbox is the only outbound path. State, history and outgoing
      rows commit together. An event row kind is event.<routing key>; strip event.
      before publishing. Credit row kinds already equal their routing keys.
    - Publish persistent messages (delivery_mode 2) with broker confirmations.
      AMQP message_id = messageId, type = routing key, content_type = application/json,
      timestamp = occurredAt, correlation_id = correlationId when present.
    - Delivery is at-least-once and may reorder. Deduplicate by messageId and ack
      only after effects are durable. Reject undecodable/unknown messages without
      requeue to dead-letter them. Older errandVersion events may be ignored, but
      do not deduplicate by version alone: withdrawn and expired share a version.
    - Credit command messageId is its stable outbox idempotency key, preserved on
      retries, timeout resends and admin replay. Results set correlationId to that key
      and use a stable messageId, proposed as <command messageId>:<result routing key>.
    - Event rows end at SENT. Credit rows wait for a result; missing results cause a
      resend with the same key (default confirmation timeout 10 minutes). Publish
      failures use bounded backoff; exhausted rows require audited admin replay.
    - Duplicate credit commands replay the original result without another balance
      change. Release for an unknown errand records a tombstone so a late reserve
      is refused with RESERVATION_RELEASED.
    - credit.adjust uses absolute newAmount and a strictly increasing seq: edits
      requested at version v use 2*v; reversals at new version w use 2*w-1. An adjust
      with seq <= the last applied seq returns the current amount without changes.
    - credit.operation_failed marks the outbox row FAILED, with no automatic retry.

    Lifecycle:
    - Submission persists PENDING_RESERVATION plus credit.reserve and errand.placed.
      Reservation success opens it; refusal rejects it. Reservation timeout rejects
      it and enqueues a compensating release (default timeout 5 minutes).
    - Only OPEN errands can be edited or cancelled. Reward edits remain pending at
      the same version. Acceptance uses original details and drops any pending edit,
      enqueueing an adjustment back to the original reward. Matching credit results
      apply/drop pending edits; stale results do not change the errand. Edit timeout
      drops the edit and enqueues a reversal (default timeout 5 minutes).
    - Pickup-deadline withdrawal returns ASSIGNED to OPEN if acceptance is still
      possible; otherwise it emits withdrawn then expired at the same version and
      releases the reservation. Delivery overdue from PICKED_UP requires review.
    - DELIVERED completes on requester confirmation, verification lapse (default
      30 minutes), or admin completion. Admin may instead refund a reviewed errand.
      Completed/refunded states enqueue credit commands; their results confirm funds.
    - Cancellation, expiry and completion events are notification facts, not a second
      mechanism for credit-service to initiate release or transfer.

    Known limitation retained from the proposal: adjustment seq orders adjustments
    only, so a transfer can overtake a compensating adjustment. Credit-service
    handles this by paying the transfer amount: the courier gets exactly amount,
    taken from the reservation first. A surplus in the reservation returns to the
    requester's available credits, and a shortfall is taken from them; if they
    cannot cover it, credit.operation_failed with INSUFFICIENT_CREDITS is sent and
    the command can be sent again. This contract does not introduce a new blocking
    edit state.

    Privacy: user IDs are Auth0 subjects, not UUIDs. Omit optional values rather than
    sending null. Contact names and mobile numbers must never be published; pending
    edit event details explicitly exclude them. Free-text reasons require the same
    access controls as the events carrying them.
servers:
  local:
    host: queue-service:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ on the local Docker Compose network.
defaultContentType: application/json
channels:
  creditReserve:
    address: credit.reserve
    description: Reserve a positive integer reward for a newly placed errand.
    messages:
      message:
        $ref: "#/components/messages/CreditReserve"
    bindings:
      $ref: "#/components/channelBindings/CreditCommands"
  creditAdjust:
    address: credit.adjust
    description: Set the absolute reservation amount. Used for reward edits and
      compensating reversals; seq orders adjustments.
    messages:
      message:
        $ref: "#/components/messages/CreditAdjust"
    bindings:
      $ref: "#/components/channelBindings/CreditCommands"
  creditRelease:
    address: credit.release
    description: Release the entire reservation on cancellation, expiry, admin
      refund or reservation timeout compensation.
    messages:
      message:
        $ref: "#/components/messages/CreditRelease"
    bindings:
      $ref: "#/components/channelBindings/CreditCommands"
  creditTransfer:
    address: credit.transfer
    description: Transfer the reservation to the courier after requester
      confirmation, verification lapse or admin completion.
    messages:
      message:
        $ref: "#/components/messages/CreditTransfer"
    bindings:
      $ref: "#/components/channelBindings/CreditCommands"
  creditReserved:
    address: credit.reserved
    description: Reservation succeeded; a matching PENDING_RESERVATION errand becomes OPEN.
    messages:
      message:
        $ref: "#/components/messages/CreditReserved"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditReservationRefused:
    address: credit.reservation_refused
    description: Reservation refused; a matching pending errand becomes REJECTED
      with the credit code as its reason.
    messages:
      message:
        $ref: "#/components/messages/CreditReservationRefused"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditAdjusted:
    address: credit.adjusted
    description: Adjustment acknowledged. Apply a pending edit only when its key
      matches correlationId; ignore stale edit outcomes.
    messages:
      message:
        $ref: "#/components/messages/CreditAdjusted"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditAdjustRefused:
    address: credit.adjust_refused
    description: Adjustment refused. Drop only the pending edit matching
      correlationId and retain the original details.
    messages:
      message:
        $ref: "#/components/messages/CreditAdjustRefused"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditReleased:
    address: credit.released
    description: Reservation released, including an already released reservation.
      Confirm the matching outbox row.
    messages:
      message:
        $ref: "#/components/messages/CreditReleased"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditTransferred:
    address: credit.transferred
    description: Reservation transferred, including an already transferred
      reservation. Confirm the matching outbox row.
    messages:
      message:
        $ref: "#/components/messages/CreditTransferred"
    bindings:
      $ref: "#/components/channelBindings/Events"
  creditOperationFailed:
    address: credit.operation_failed
    description: Impossible state or contract failure. Mark the matching outbox row
      FAILED for admin review; do not retry automatically.
    messages:
      message:
        $ref: "#/components/messages/CreditOperationFailed"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandPlaced:
    address: errand.placed
    description: Submitted in PENDING_RESERVATION; credit.reserve is recorded in the
      same transaction. This is not yet an available order.
    messages:
      message:
        $ref: "#/components/messages/ErrandPlaced"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandOpened:
    address: errand.opened
    description: Reservation succeeded and the errand is OPEN. Corresponds to
      OrderCreated in CS3219.drawio.xml.
    messages:
      message:
        $ref: "#/components/messages/ErrandOpened"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandRejected:
    address: errand.rejected
    description: Reservation refused or timed out. Notify the requester; timeout
      compensation also requests credit.release.
    messages:
      message:
        $ref: "#/components/messages/ErrandRejected"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandEdited:
    address: errand.edited
    description: An OPEN errand edit was applied immediately when reward was
      unchanged, or after credit.adjusted.
    messages:
      message:
        $ref: "#/components/messages/ErrandEdited"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandEditRequested:
    address: errand.edit_requested
    description: Reward-changing edit is pending while the errand remains OPEN at
      the same version. pendingEdit excludes contact fields.
    messages:
      message:
        $ref: "#/components/messages/ErrandEditRequested"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandEditRejected:
    address: errand.edit_rejected
    description: Pending edit was refused or timed out; original details remain.
      Notify the requester. A timeout also sends a compensating adjustment.
    messages:
      message:
        $ref: "#/components/messages/ErrandEditRejected"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandAccepted:
    address: errand.accepted
    description: "Courier accepted the OPEN errand; status is ASSIGNED. Acceptance
      wins over a pending edit: discard it, set editDropped and enqueue
      credit.adjust to restore the original reward."
    messages:
      message:
        $ref: "#/components/messages/ErrandAccepted"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandCancelled:
    address: errand.cancelled
    description: Requester cancelled an OPEN errand; credit.release is recorded
      atomically. Notification processing must not initiate another refund.
    messages:
      message:
        $ref: "#/components/messages/ErrandCancelled"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandWithdrawn:
    address: errand.withdrawn
    description: Courier withdrew voluntarily or was removed at the pickup deadline.
      Return to OPEN if the acceptance deadline is future; otherwise expire.
      courierId identifies the removed courier.
    messages:
      message:
        $ref: "#/components/messages/ErrandWithdrawn"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandExpired:
    address: errand.expired
    description: Acceptance deadline passed while OPEN, or withdrawal occurred after
      that deadline. Release the reservation. Notify requester only when
      unassigned, otherwise requester and the removed courier.
    messages:
      message:
        $ref: "#/components/messages/ErrandExpired"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandPickedUp:
    address: errand.picked_up
    description: Assigned courier picked up the errand; status is PICKED_UP.
    messages:
      message:
        $ref: "#/components/messages/ErrandPickedUp"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandDelivered:
    address: errand.delivered
    description: Courier marked delivery; status is DELIVERED while requester
      verification is pending.
    messages:
      message:
        $ref: "#/components/messages/ErrandDelivered"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandReviewRequired:
    address: errand.review_required
    description: Delivery issue, overdue delivery or requester dispute requires
      review. Notify requester and admin for COURIER_ISSUE or DELIVERY_OVERDUE;
      admin for REQUESTER_DISPUTE.
    messages:
      message:
        $ref: "#/components/messages/ErrandReviewRequired"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandCompleted:
    address: errand.completed
    description: Requester confirmed delivery, verification lapsed or admin
      completed review. credit.transfer is recorded atomically. This event is
      not proof that payout has completed.
    messages:
      message:
        $ref: "#/components/messages/ErrandCompleted"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandRefunded:
    address: errand.refunded
    description: Admin resolved review for the requester. credit.release is recorded
      atomically; this event is not proof that release has completed.
    messages:
      message:
        $ref: "#/components/messages/ErrandRefunded"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandAcceptRejected:
    address: errand.accept_rejected
    description: Acceptance refused by a state/version check (409), not a 403
      eligibility refusal. Notify the courier in actorId.
    messages:
      message:
        $ref: "#/components/messages/ErrandAcceptRejected"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandCancelRejected:
    address: errand.cancel_rejected
    description: Cancellation refused by a state check (409). Notify the requester
      in actorId.
    messages:
      message:
        $ref: "#/components/messages/ErrandCancelRejected"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandPickupRejected:
    address: errand.pickup_rejected
    description: Pickup refused by a state check (409). Notify the courier in actorId.
    messages:
      message:
        $ref: "#/components/messages/ErrandPickupRejected"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandVerificationReminder:
    address: errand.verification_reminder
    description: Remind the requester to verify a DELIVERED errand before
      verificationDeadline.
    messages:
      message:
        $ref: "#/components/messages/ErrandVerificationReminder"
    bindings:
      $ref: "#/components/channelBindings/Events"
  errandPickupDeadlineApproaching:
    address: errand.pickup_deadline_approaching
    description: Remind the assigned courier before pickupDeadline.
    messages:
      message:
        $ref: "#/components/messages/ErrandPickupDeadlineApproaching"
    bindings:
      $ref: "#/components/channelBindings/Events"
