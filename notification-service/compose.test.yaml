# Tool: Claude, date: 2026-11-11
# Scope: integration test environment orchestration for notification-service.
# Author review: I validated correctness, edited for style, and added boundary checks.

# Throwaway Postgres and RabbitMQ for the integration tests. Start with
#   docker compose -f compose.test.yaml up -d
# then run the tests with both URLs set (one process, shared resources):
#   TEST_DATABASE_URL=postgres://notification_test@127.0.0.1:5435/notification_test?sslmode=disable \
#   TEST_AMQP_URL=amqp://guest:guest@127.0.0.1:5673/ \
#   go test -p 1 ./...
# Integration tests skip themselves when their URL is unset.
services:
  notification-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_test
      POSTGRES_USER: notification_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${NOTIFICATION_TEST_DB_PORT:-5435}:5432"
    volumes:
      - notification-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test -d notification_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  notification-test-broker:
    image: rabbitmq:4-alpine
    ports:
      - "127.0.0.1:${NOTIFICATION_TEST_AMQP_PORT:-5673}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  notification-test-data:
