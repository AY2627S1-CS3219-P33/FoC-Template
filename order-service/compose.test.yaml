# Test dependencies for integration tests. Tests skip unless the matching
# variable is set, for example with the default ports:
#   TEST_DATABASE_URL=postgres://order_test@127.0.0.1:5434/order_test?sslmode=disable
#   TEST_AMQP_URL=amqp://guest:guest@127.0.0.1:5673/
#   TEST_REDIS_URL=redis://127.0.0.1:6380/0
services:
  order-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_test
      POSTGRES_USER: order_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # 5434 avoids supplier-service's 5433. Override when it is taken.
      - "127.0.0.1:${ORDER_TEST_DB_PORT:-5434}:5432"
    volumes:
      - order-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_test -d order_test"]
      interval: 2s
      timeout: 2s
      retries: 15

  order-test-rabbitmq:
    image: rabbitmq:4-management
    ports:
      # AMQP and the management UI, offset from the defaults 5672 and 15672.
      - "127.0.0.1:${ORDER_TEST_AMQP_PORT:-5673}:5672"
      - "127.0.0.1:${ORDER_TEST_AMQP_UI_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 24

  order-test-redis:
    image: redis:7.4-alpine
    # No persistence: every run starts empty.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${ORDER_TEST_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  order-test-data:
