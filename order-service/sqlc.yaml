# AI Assistance Disclosure:
# Tool: Claude Code (model: Claude Opus 5.5), date: 2026-10-18
# Scope: Boilerplate generation for build/container/tooling configuration.
# Author review: Reviewed, validated, and tested by the authors.

version: "2"
# Four targets so each stream regenerates only its own package. All read the
# full migrations/ schema; every table but saved_places is frozen in S0
# (commit-plan.md).
sql:
  # Person A: errand lifecycle (Store implementation).
  - engine: postgresql
    schema: migrations
    queries: queries/errands.sql
    gen:
      go:
        package: errandgen
        out: internal/database/errandgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
  # Person B: fences, reviews, audit and settings.
  - engine: postgresql
    schema: migrations
    queries: queries/ops.sql
    gen:
      go:
        package: opsgen
        out: internal/database/opsgen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
  # Person C: outbox claiming, delivery and credit results.
  - engine: postgresql
    schema: migrations
    queries: queries/messaging.sql
    gen:
      go:
        package: msggen
        out: internal/database/msggen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
  # Requester enhancements: saved places and scheduled errands.
  - engine: postgresql
    schema: migrations
    queries: queries/requester.sql
    gen:
      go:
        package: requestergen
        out: internal/database/requestergen
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
