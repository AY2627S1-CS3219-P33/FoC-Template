services:
  supplier-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supplier_test
      POSTGRES_USER: supplier_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier_test -d supplier_test"]
      interval: 2s
      timeout: 2s
      retries: 15
