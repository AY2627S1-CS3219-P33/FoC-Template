# Tool: Claude Code (model: Claude Opus 5.5), date: 2026-09-29
# Scope: Documentation formatting of the team-defined API specification.
# Author review: Reviewed, validated, and tested by the authors.

operations:
  uploadSupplierImage:
    operationId: uploadSupplierImage
    tags: [Administration]
    summary: Upload an optional supplier image
    description: >-
      Accepts exactly one JPEG or PNG file, at most 5 MiB (5242880 bytes)
      and 16 million pixels, in the image field. File contents are decoded
      and validated; filename and supplied MIME type are not trusted.
      Each upload uses a unique S3 key and returns a permanent imageUrl.
      Submit that URL through the existing supplier create or update endpoint.
      This operation does not create or modify a supplier record.
      Upload retries may create additional objects. Old images are retained
      for historical supplier versions; abandoned uploads are not cleaned up.
    x-required-permissions: [suppliers:read, suppliers:manage]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [image]
            properties:
              image:
                type: string
                format: binary
    responses:
      "201":
        description: Image stored; use imageUrl when saving a supplier.
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl:
                  type: string
                  format: uri
                  example: https://images.example.com/suppliers/unique-key.jpeg
      "400":
        description: Invalid multipart request, file format, or dimensions.
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/Error
      "413":
        description: Image or multipart request exceeds the allowed size.
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/Error
      "401":
        $ref: ./common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ./common.yaml#/components/responses/Forbidden
      "503":
        $ref: ./common.yaml#/components/responses/DependencyUnavailable

  createSupplier:
    operationId: createSupplier
    tags: [Administration]
    summary: Create a supplier and its first version
    description: >-
      supplierId and versionId are generated by the service. building and
      type must name an existing, unretired building and supplier type
      (managed through /buildings and /supplier-types). Each is resolved by
      lookup key, so case, spacing, and punctuation do not matter; a value
      that matches no live lookup is rejected with a field violation and
      never creates one. The response carries the canonical names and their
      buildingId and typeId, so "com2" is returned as "Com 2".
    x-required-permissions: [suppliers:read, suppliers:manage]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./common.yaml#/components/schemas/SupplierWrite
    responses:
      "201":
        description: Supplier created.
        headers:
          Location:
            description: Current supplier resource path.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/Supplier
      "400":
        description: >-
          The request or one or more named fields are invalid. A building or
          type that matches no existing, unretired lookup is reported in
          fields alongside every other violation.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ./common.yaml#/components/schemas/Error
                - properties:
                    code:
                      const: INVALID_ARGUMENT
            examples:
              unknownBuildingAndType:
                summary: Neither building nor type exists
                value:
                  code: INVALID_ARGUMENT
                  message: supplier fields are invalid
                  fields:
                    - field: building
                      message: must be an existing building
                    - field: type
                      message: must be an existing supplier type
              retiredBuilding:
                summary: The only building with this lookup key is retired
                value:
                  code: INVALID_ARGUMENT
                  message: supplier fields are invalid
                  fields:
                    - field: building
                      message: must be an existing building
      "401":
        $ref: ./common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ./common.yaml#/components/responses/Forbidden
      "409":
        $ref: ./common.yaml#/components/responses/NameConflict
      "500":
        $ref: ./common.yaml#/components/responses/Internal
      "503":
        $ref: ./common.yaml#/components/responses/DependencyUnavailable

  updateSupplier:
    operationId: updateSupplier
    tags: [Administration]
    summary: Append a new current supplier version
    description: >-
      Applies supplied fields to the current snapshot and creates a new,
      immutable versionId. supplierId cannot change. null imageUrl removes the
      image. An empty object is invalid. A supplied building or type must
      name an existing, unretired lookup and is resolved like create. An
      omitted one keeps its current lookup even if that lookup has since
      been retired, so other fields stay editable; supplying a retired
      building or type is rejected.
    x-required-permissions: [suppliers:read, suppliers:manage]
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./common.yaml#/components/parameters/SupplierID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./common.yaml#/components/schemas/SupplierPatch
    responses:
      "200":
        description: The new current version.
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/Supplier
      "400":
        description: >-
          The request or one or more named fields are invalid. A supplied
          building or type that matches no existing, unretired lookup is
          reported in fields alongside every other violation.
        content:
          application/json:
            schema:
              allOf:
                - $ref: ./common.yaml#/components/schemas/Error
                - properties:
                    code:
                      const: INVALID_ARGUMENT
            examples:
              retiredBuilding:
                summary: The supplied building has been retired
                value:
                  code: INVALID_ARGUMENT
                  message: supplier fields are invalid
                  fields:
                    - field: building
                      message: must be an existing building
              unknownType:
                summary: The supplied type does not exist
                value:
                  code: INVALID_ARGUMENT
                  message: supplier fields are invalid
                  fields:
                    - field: type
                      message: must be an existing supplier type
      "401":
        $ref: ./common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ./common.yaml#/components/responses/Forbidden
      "404":
        $ref: ./common.yaml#/components/responses/SupplierNotFound
      "409":
        $ref: ./common.yaml#/components/responses/NameConflict
      "500":
        $ref: ./common.yaml#/components/responses/Internal
      "503":
        $ref: ./common.yaml#/components/responses/DependencyUnavailable

  deleteSupplier:
    operationId: deleteSupplier
    tags: [Administration]
    summary: Delete a supplier from the current catalogue
    description: >-
      Durably records this idempotent operation before using the order-service
      deletion fence. Replaying the key for this supplier observes or
      continues the original operation; using it for another supplier is
      invalid. Deletion is rejected while an active errand exists or when the
      pre-delete fence result is unresolved. Immutable versions are retained
      for historical reads.
    x-required-permissions: [suppliers:read, suppliers:manage]
    security:
      - bearerAuth: []
    parameters:
      - $ref: ./common.yaml#/components/parameters/SupplierID
      - $ref: ./common.yaml#/components/parameters/DeletionOperationID
    responses:
      "202":
        description: >-
          The operation is commit_pending: the supplier is already
          soft-deleted and the durable operation will keep reconciling an
          unconfirmed fence commit. A replay returns the same outcome until
          commit is confirmed.
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/DeletionPending
      "204":
        description: >-
          Supplier deletion completed, or replay of an already completed
          operation; no response body.
      "400":
        $ref: ./common.yaml#/components/responses/InvalidArgument
      "401":
        $ref: ./common.yaml#/components/responses/Unauthenticated
      "403":
        $ref: ./common.yaml#/components/responses/Forbidden
      "404":
        $ref: ./common.yaml#/components/responses/SupplierNotFound
      "409":
        $ref: ./common.yaml#/components/responses/ActiveErrands
      "503":
        $ref: ./common.yaml#/components/responses/DeletionFenceUnavailable
      "500":
        $ref: ./common.yaml#/components/responses/Internal
