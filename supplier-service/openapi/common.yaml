operations:
  readiness:
    operationId: getReadiness
    tags: [Operations]
    summary: Check whether required supplier operations can run
    security: []
    responses:
      "200":
        description: Service dependencies are ready.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Readiness"
      "503":
        description: A required service dependency is unavailable.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Readiness"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Auth0 RS256 access token for https://api.foc.local/supplier-service,
        validated locally using cached JWKS. Reads require suppliers:read;
        writes additionally require suppliers:manage in the permissions claim.
        Request payload identity or role fields are never trusted.

  parameters:
    SupplierID:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeletionOperationID:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated UUID that identifies one logical deletion. It is
        durably bound to the supplier before the deletion fence is acquired.
        Reuse the same value when retrying an ambiguous or interrupted
        request. Reuse for another supplier is invalid.
      schema:
        type: string
        format: uuid
    BuildingID:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierTypeID:
      name: supplierTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncludeRetired:
      name: includeRetired
      in: query
      description: >-
        true also lists retired rows, marked retired true. Only true and
        false are accepted.
      schema:
        type: boolean
        default: false
    Query:
      name: q
      in: query
      description: Normalized, case-insensitive name or location search.
      schema:
        type: string
        maxLength: 120
    Type:
      name: type
      in: query
      description: >-
        Supplier type, matched by lookup key: case, spaces, and punctuation
        are ignored, so "Food/Coffee" and "food coffee" are the same type.
      schema:
        type: string
        maxLength: 64
    Building:
      name: building
      in: query
      description: >-
        Building, matched by lookup key: case, spaces, and punctuation are
        ignored, so "COM-2" and "com 2" are the same building. An unknown or
        retired building yields an empty page.
      schema:
        type: string
        maxLength: 120
    Sort:
      name: sort
      in: query
      description: >-
        Result ordering, applied before the cursor. name (default) orders by
        normalized name then supplierId. type orders by the type's lookup key
        (lower case, letters and digits only), then normalized name, then
        supplierId. building orders by the building's lookup key, then
        normalized name, then supplierId. These are
        ascending; the "-" prefixed values reverse every key, giving the same
        sequence backwards. A cursor is valid only with the sort that
        produced it.
      schema:
        type: string
        enum: [name, -name, type, -type, building, -building]
        default: name
    Limit:
      name: limit
      in: query
      description: Maximum page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
        maxLength: 512

  schemas:
    SupplierFields:
      type: object
      required:
        - name
        - type
        - building
        - floor
        - locationDescription
        - latitude
        - longitude
        - openingTime
        - closingTime
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
        building:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        floor:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '\S'
        locationDescription:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        openingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        closingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["18:00"]
        imageUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          pattern: '^https?://'

    SupplierWrite:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
      unevaluatedProperties: false

    SupplierPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '\S'
        building:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        floor:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '\S'
        locationDescription:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        openingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        closingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        imageUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          pattern: '^https?://'
      additionalProperties: false

    Supplier:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [supplierId, versionId, buildingId, typeId, available, createdAt, updatedAt]
          properties:
            supplierId:
              type: string
              format: uuid
              readOnly: true
            versionId:
              type: string
              format: uuid
              readOnly: true
            buildingId:
              type: string
              format: uuid
              description: >-
                The building lookup row. building is its canonical name;
                lookup names never change, so historical versions keep the
                name they were created with.
              readOnly: true
            typeId:
              type: string
              format: uuid
              description: The supplier-type lookup row; type is its canonical name.
              readOnly: true
            available:
              type: boolean
              const: true
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
      unevaluatedProperties: false

    SupplierVersion:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [supplierId, versionId, buildingId, typeId, available, createdAt]
          properties:
            supplierId:
              type: string
              format: uuid
              readOnly: true
            versionId:
              type: string
              format: uuid
              readOnly: true
            buildingId:
              type: string
              format: uuid
              description: >-
                The building lookup row. building is its canonical name;
                lookup names never change, so historical versions keep the
                name they were created with.
              readOnly: true
            typeId:
              type: string
              format: uuid
              description: The supplier-type lookup row; type is its canonical name.
              readOnly: true
            available:
              type: boolean
              description: True only for the current version of a non-deleted supplier.
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
      unevaluatedProperties: false

    SupplierPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          description: Omitted when there is no next page.

    Lookup:
      type: object
      required: [id, name, retired]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: >-
            Canonical display name. It never changes; supplier building and
            type values are these names.
          readOnly: true
        retired:
          type: boolean
          description: >-
            A retired row cannot be assigned to suppliers but still resolves
            for versions that already reference it.
          readOnly: true
      additionalProperties: false

    LookupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          description: >-
            Ordered by lookup key, then id. Unpaginated and capped at 500
            rows.
          items:
            $ref: "#/components/schemas/Lookup"
      additionalProperties: false

    BuildingCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >-
            Trimmed before storage and bounded after trimming. Must contain a
            letter or digit.
          minLength: 1
          maxLength: 120
          pattern: '\S'
      additionalProperties: false

    SupplierTypeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >-
            Trimmed before storage and bounded after trimming. Must contain a
            letter or digit.
          minLength: 1
          maxLength: 64
          pattern: '\S'
      additionalProperties: false

    ErrorField:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
      additionalProperties: false

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - FORBIDDEN
            - SUPPLIER_NOT_FOUND
            - SUPPLIER_VERSION_NOT_FOUND
            - SUPPLIER_NAME_CONFLICT
            - SUPPLIER_HAS_ACTIVE_ERRANDS
            - DELETION_FENCE_UNAVAILABLE
            - BUILDING_NOT_FOUND
            - BUILDING_CONFLICT
            - BUILDING_IN_USE
            - SUPPLIER_TYPE_NOT_FOUND
            - SUPPLIER_TYPE_CONFLICT
            - SUPPLIER_TYPE_IN_USE
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorField"
      additionalProperties: false

    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
      additionalProperties: false

    DeletionPending:
      type: object
      required: [operationId, state]
      properties:
        operationId:
          type: string
          format: uuid
        state:
          type: string
          const: commit_pending
      additionalProperties: false

  responses:
    InvalidArgument:
      description: The request or one or more named fields are invalid.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: INVALID_ARGUMENT
    Unauthenticated:
      description: A valid authenticated identity is required.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: UNAUTHENTICATED
    Forbidden:
      description: >-
        The authenticated identity lacks the required explicit permission or its
        authoritative account state denies access.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: FORBIDDEN
    SupplierNotFound:
      description: The supplier does not exist or has been deleted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_NOT_FOUND
    SupplierVersionNotFound:
      description: The immutable supplier version does not exist.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_VERSION_NOT_FOUND
    NameConflict:
      description: The normalized name is used by another non-deleted supplier.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_NAME_CONFLICT
    ActiveErrands:
      description: One or more active errands still use this supplier.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_HAS_ACTIVE_ERRANDS
    DeletionFenceUnavailable:
      description: >-
        The fence could not be acquired, inspected, or released safely. The
        supplier was not deleted by this operation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: DELETION_FENCE_UNAVAILABLE
    BuildingNotFound:
      description: No building has this id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: BUILDING_NOT_FOUND
    BuildingConflict:
      description: A live building has the same lookup key; the message names it.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: BUILDING_CONFLICT
    BuildingInUse:
      description: The current version of a non-deleted supplier uses this building.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: BUILDING_IN_USE
    SupplierTypeNotFound:
      description: No supplier type has this id.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_TYPE_NOT_FOUND
    SupplierTypeConflict:
      description: A live supplier type has the same lookup key; the message names it.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_TYPE_CONFLICT
    SupplierTypeInUse:
      description: The current version of a non-deleted supplier uses this supplier type.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: SUPPLIER_TYPE_IN_USE
    DependencyUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: DEPENDENCY_UNAVAILABLE
    Internal:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    const: INTERNAL
