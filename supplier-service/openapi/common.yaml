operations:
  readiness:
    operationId: getReadiness
    tags: [Operations]
    summary: Check whether required supplier operations can run
    security: []
    responses:
      "200":
        description: Service dependencies are ready.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Readiness"
      "503":
        description: A required service dependency is unavailable.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Readiness"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque credential verified through the authentication port. Request
        payload identity or role fields are never trusted.

  parameters:
    SupplierID:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionID:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      description: Normalized, case-insensitive name or location search.
      schema:
        type: string
        maxLength: 120
    Type:
      name: type
      in: query
      description: Exact, case-insensitive supplier type.
      schema:
        type: string
        maxLength: 64
    Limit:
      name: limit
      in: query
      description: Maximum page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the preceding page.
      schema:
        type: string
        maxLength: 512

  schemas:
    SupplierFields:
      type: object
      required:
        - name
        - type
        - building
        - floor
        - locationDescription
        - latitude
        - longitude
        - openingTime
        - closingTime
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 64
        building:
          type: string
          minLength: 1
          maxLength: 120
        floor:
          type: string
          minLength: 1
          maxLength: 32
        locationDescription:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        openingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["09:00"]
        closingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          examples: ["18:00"]
        imageUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048

    SupplierWrite:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
      unevaluatedProperties: false

    SupplierPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 64
        building:
          type: string
          minLength: 1
          maxLength: 120
        floor:
          type: string
          minLength: 1
          maxLength: 32
        locationDescription:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        openingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        closingTime:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        imageUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
      additionalProperties: false

    Supplier:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [supplierId, versionId, available, createdAt, updatedAt]
          properties:
            supplierId:
              type: string
              format: uuid
              readOnly: true
            versionId:
              type: string
              format: uuid
              readOnly: true
            available:
              type: boolean
              const: true
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
      unevaluatedProperties: false

    SupplierVersion:
      allOf:
        - $ref: "#/components/schemas/SupplierFields"
        - type: object
          required: [supplierId, versionId, available, createdAt]
          properties:
            supplierId:
              type: string
              format: uuid
              readOnly: true
            versionId:
              type: string
              format: uuid
              readOnly: true
            available:
              type: boolean
              description: True only for the current version of a non-deleted supplier.
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
      unevaluatedProperties: false

    SupplierPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Supplier"
        nextCursor:
          type: string
          description: Omitted when there is no next page.

    ErrorField:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
      additionalProperties: false

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - FORBIDDEN
            - SUPPLIER_NOT_FOUND
            - SUPPLIER_VERSION_NOT_FOUND
            - SUPPLIER_NAME_CONFLICT
            - SUPPLIER_HAS_ACTIVE_ERRANDS
            - DELETION_FENCE_UNAVAILABLE
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorField"
      additionalProperties: false

    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
      additionalProperties: false

  responses:
    InvalidArgument:
      description: The request or one or more named fields are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: A valid authenticated identity is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Administrator permission is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupplierNotFound:
      description: The supplier does not exist or has been deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupplierVersionNotFound:
      description: The immutable supplier version does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NameConflict:
      description: The normalized name is used by another non-deleted supplier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ActiveErrands:
      description: One or more active errands still use this supplier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeletionFenceUnavailable:
      description: Deletion safety could not be established; nothing was deleted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
