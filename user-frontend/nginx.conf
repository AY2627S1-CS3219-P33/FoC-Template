server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://user-service:8080;
    }

    location = /health {
        proxy_pass http://user-service:8080;
    }

    location /supplier-service/ {
        client_max_body_size 6m;
        proxy_pass http://supplier-service:3002/;
    }

    location /order-service/ {
        proxy_pass http://order-service:3003/;
    }

    location /credit-service/ {
        proxy_pass http://credit-service:3004/;
    }

    # REST and the WebSocket (/chat-service/ws). The upgrade headers are
    # forwarded so the handshake reaches the service, and the read timeout is
    # long because a chat connection stays open (the server pings every 25 s).
    location /chat-service/ {
        proxy_pass http://chat-service:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
