server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://user-service:8080;
    }

    location = /health {
        proxy_pass http://user-service:8080;
    }

    location /supplier-service/ {
        proxy_pass http://supplier-service:3002/;
    }

    location /order-service/ {
        proxy_pass http://order-service:3003/;
    }

    location /credit-service/ {
        proxy_pass http://credit-service:3004/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
