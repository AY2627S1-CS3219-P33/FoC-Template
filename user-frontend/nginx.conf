server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://user-service:8080;
    }

    location = /health {
        proxy_pass http://user-service:8080;
    }

    location /supplier-service/ {
        client_max_body_size 6m;
        proxy_pass http://supplier-service:3002/;
    }

    location /order-service/ {
        proxy_pass http://order-service:3003/;
    }

    # Resolved on each request rather than at startup. nginx refuses to start
    # when a proxy_pass host does not resolve, and admin-service exits when its
    # .env is missing, so a static proxy_pass would let a stopped admin-service
    # take the whole frontend down. This way only /admin-service/ answers 502.
    location /admin-service/ {
        resolver 127.0.0.11 valid=10s;
        set $admin_service http://admin-service:3005;
        rewrite ^/admin-service/(.*)$ /$1 break;
        proxy_pass $admin_service;
    }

    location /credit-service/ {
        proxy_pass http://credit-service:3004/;
    }

    location /notification-service/ {
        proxy_pass http://notification-service:3007/;
        # The unread-count stream is Server-Sent Events: keep the upstream
        # connection open and never buffer, so events reach the browser as the
        # service flushes them. The service also sets X-Accel-Buffering: no on
        # the stream response.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
